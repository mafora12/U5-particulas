<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fórum UPB | Relevo generacional</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="viewport" aria-label="Presentación Relevo generacional · Fórum UPB">
      <div class="stage" id="stage">
        <div class="bg-layer" id="bg-layer" aria-hidden="true"></div>
        <canvas class="particles" id="particles" aria-hidden="true"></canvas>

        <div class="panels" id="panels" aria-hidden="true">
          <div class="glass"></div>
          <div class="glass"></div>
          <div class="glass"></div>
        </div>

        <section class="copy" id="copy" aria-live="polite"></section>

        <img class="brand brand-forum" id="brand-forum" src="./assets/brand-forum.png" alt="UPB Fórum Centro de Eventos" />
        <img class="brand brand-ninety" id="brand-ninety" src="./assets/brand-90.png" alt="UPB 90 años" />

        <div class="nav-arrows" id="nav-arrows">
          <div class="nav-arrows__row">
            <button class="arrow arrow--prev" id="prev" type="button" aria-label="Diapositiva anterior">
              <img src="./assets/icons/arrow-left.svg" alt="" />
            </button>
            <span class="counter" id="counter">1/13</span>
            <button class="arrow arrow--next" id="next" type="button" aria-label="Diapositiva siguiente">
              <img src="./assets/icons/arrow-right.svg" alt="" />
            </button>
          </div>
        </div>

        <div class="lang-toggle" id="lang-toggle">
          <button class="lang-toggle__gear" id="gear" type="button" aria-label="Idioma" aria-expanded="false">
            <img class="gear-closed" src="./assets/icons/gear-closed.svg" alt="" />
            <img class="gear-open" src="./assets/icons/gear-open-vector.svg" alt="" />
          </button>
          <div class="lang-toggle__pill">
            <span class="lang-toggle__highlight"></span>
            <button type="button" data-lang="es">Esp</button>
            <button type="button" data-lang="pt">Por</button>
          </div>
        </div>

        <button class="fullscreen" id="fullscreen" type="button" aria-label="Pantalla completa">
          <img src="./assets/icons/fullscreen.svg" alt="" />
        </button>

        <p class="notice" id="notice" role="status"></p>

        <div class="help" id="help">
          <button class="help__button" id="help-button" type="button" aria-label="Ayuda" aria-expanded="false">
            <img src="./assets/icons/help-open-vector.svg" alt="" />
          </button>
          <div class="help__pill">
            <span class="help__chip help__chip--wide"></span>
            <span class="help__chip"></span>
            <span class="help__chip"></span>
            <span class="help__chip"></span>
          </div>
        </div>
      </div>
    </main>

    <script src="./config.js"></script>
    <script src="./slides.js"></script>
    <script src="./particles.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
